name: Build Release APK

on:
    release:
        types:
            - published
    workflow_dispatch:

defaults:
    run:
        working-directory: frontend

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Install dependencies
              run: npm ci

            - name: Write env file
              run: echo "EXPO_PUBLIC_API_BASE_URL=${API_BASE_URL:-https://api.mufasadev.nl}" > .env
              env:
                  API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

            - name: Build release APK
              working-directory: frontend/android
              run: ./gradlew assembleRelease

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: trade2-release-apk
                  path: frontend/android/app/build/outputs/apk/release/app-release.apk
                  if-no-files-found: error

            - name: Attach APK to release
              if: github.event_name == 'release'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${{ github.event.release.tag_name }}" android/app/build/outputs/apk/release/app-release.apk --clobber
